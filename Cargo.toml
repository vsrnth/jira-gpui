[workspace]
members = [
    "apps/gpui",
    "crates/application",
    "crates/desktop-notifications",
    "crates/domain",
    "crates/jira",
    "crates/jira-http",
    "crates/storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
# GPUI's compatible Zed revision uses std::hint::cold_path (stable in 1.95).
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
futures-channel = "0.3.31"
futures-lite = "2.6.1"
# Keep this source URL identical to gpui-component's declaration so Cargo
# resolves one GPUI type universe. Cargo.lock pins it to the compatible commit.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui-component = { version = "0.5.2", git = "https://github.com/longbridge/gpui-component", rev = "b29ee13379e161c2fb68c14c229c958d52d6ffe4" }
notify-rust = { version = "4.18.0", default-features = false, features = ["z"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", default-features = false, features = ["net", "rt", "sync", "time"] }
thiserror = "2.0.18"
time = { version = "0.3.41", features = ["formatting", "macros", "parsing", "serde"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
taffy = { opt-level = 3 }

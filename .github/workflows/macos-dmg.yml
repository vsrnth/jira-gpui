name: macOS DMG

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: macOS native DMG (macos-14 architecture)
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install Rust 1.95.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.95.0
          rustc --version
          cargo --version

      - name: Resolve tag version and native architecture
        id: resolve-version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          case "$REF_NAME" in
            v*) version=${REF_NAME#v} ;;
            *)
              echo 'DMG builds require a v-prefixed version tag' >&2
              exit 1
              ;;
          esac
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
            echo "Unsupported macOS DMG version: $version" >&2
            exit 1
          fi

          bundle_version=${version%%-*}
          if [[ ! "$bundle_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not derive numeric bundle version from: $version" >&2
            exit 1
          fi

          native_arch=$(uname -m)
          case "$native_arch" in
            arm64|x86_64) ;;
            *)
              echo "Unsupported native macOS architecture: $native_arch" >&2
              exit 1
              ;;
          esac

          source_sha=$(git rev-parse --verify HEAD)
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected checked-out commit: $source_sha" >&2
            exit 1
          fi

          printf 'Tag: %s\nVersion: %s\nBundle version: %s\nNative runner architecture: %s\nSource SHA: %s\n' \
            "$REF_NAME" "$version" "$bundle_version" "$native_arch" "$source_sha"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'bundle_version=%s\n' "$bundle_version" >> "$GITHUB_OUTPUT"
          printf 'native_arch=%s\n' "$native_arch" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-

      - name: Cache Cargo build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-${{ steps.resolve-version.outputs.source_sha }}-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Check production code with Clippy
        run: cargo clippy --workspace --lib --bins --locked -- -D warnings

      - name: Build release binary
        run: cargo build --release --locked -p jira-gpui

      - name: Build native DMG
        shell: bash
        env:
          VERSION: ${{ steps.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$VERSION" packaging/macos/build-dmg.sh --skip-build

      - name: Independently validate native DMG
        shell: bash
        env:
          VERSION: ${{ steps.resolve-version.outputs.version }}
          BUNDLE_VERSION: ${{ steps.resolve-version.outputs.bundle_version }}
          NATIVE_ARCH: ${{ steps.resolve-version.outputs.native_arch }}
        run: |
          set -euo pipefail

          dmg="dist/Jira_Desk-${VERSION}-${NATIVE_ARCH}.dmg"
          checksum="${dmg}.sha256"
          test -f "$dmg"
          test ! -L "$dmg"
          test -f "$checksum"
          test ! -L "$checksum"

          (cd "$(dirname "$dmg")" && shasum -a 256 --check "$(basename "$checksum")")

          image_info=$(hdiutil imageinfo "$dmg")
          printf '%s\n' "$image_info"
          format=$(printf '%s\n' "$image_info" | sed -nE 's/^[[:space:]]*[Ff]ormat[[:space:]]*:[[:space:]]*([^[:space:]]+).*/\1/p' | head -n 1)
          test "$format" = UDZO

          mount_point=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/jira-desk-dmg-check.XXXXXXXX")
          attached_device=''
          cleanup() {
            status=$?
            trap - EXIT HUP INT TERM
            set +e
            if [ -n "${attached_device:-}" ]; then
              hdiutil detach "$attached_device" >/dev/null 2>&1 || \
                hdiutil detach -force "$attached_device" >/dev/null 2>&1 || true
            fi
            if [ -n "${mount_point:-}" ] && [ -d "$mount_point" ]; then
              rmdir "$mount_point" >/dev/null 2>&1 || rm -rf -- "$mount_point"
            fi
            exit "$status"
          }
          trap cleanup EXIT HUP INT TERM

          attach_output=$(hdiutil attach -readonly -nobrowse -noautoopen \
            -mountpoint "$mount_point" "$dmg")
          printf '%s\n' "$attach_output"
          attached_device=$(printf '%s\n' "$attach_output" | awk '/^\/dev\// { device=$1 } END { print device }')
          case "$attached_device" in
            /dev/*) ;;
            *) echo 'Could not determine attached DMG device' >&2; exit 1 ;;
          esac

          app="$mount_point/Jira Desk.app"
          contents="$app/Contents"
          binary="$contents/MacOS/jira-gpui"
          plist="$contents/Info.plist"
          icon="$contents/Resources/JiraDesk.icns"
          test -d "$app"
          test -x "$binary"
          test -s "$icon"
          test -L "$mount_point/Applications"
          test "$(readlink "$mount_point/Applications")" = /Applications

          # A compressed UDZO image must also reject writes when attached.
          readonly_probe="$mount_point/.jira-desk-readonly-probe-$$"
          if touch "$readonly_probe" 2>/dev/null; then
            echo 'DMG mounted writable despite -readonly' >&2
            exit 1
          fi

          plist_value() {
            plutil -extract "$1" raw -o - "$plist"
          }
          test "$(plist_value CFBundleIdentifier)" = dev.jiradesk.JiraDesk
          test "$(plist_value CFBundleVersion)" = "$BUNDLE_VERSION"
          test "$(plist_value CFBundleShortVersionString)" = "$BUNDLE_VERSION"
          [[ "$BUNDLE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          codesign --verify --deep --strict "$app"
          signature_info=$(codesign --display --verbose=2 "$app" 2>&1)
          printf '%s\n' "$signature_info"
          grep -Fq 'Signature=adhoc' <<<"$signature_info"

          binary_info=$(file -b "$binary")
          printf '%s\n' "$binary_info"
          grep -Fq 'Mach-O' <<<"$binary_info"
          mach_arches=$(lipo -archs "$binary")
          test "$mach_arches" = "$NATIVE_ARCH"
          printf 'Validated native Mach-O architecture: %s\n' "$mach_arches"

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jira-desk-${{ steps.resolve-version.outputs.version }}-${{ steps.resolve-version.outputs.native_arch }}
          path: |
            dist/Jira_Desk-${{ steps.resolve-version.outputs.version }}-${{ steps.resolve-version.outputs.native_arch }}.dmg
            dist/Jira_Desk-${{ steps.resolve-version.outputs.version }}-${{ steps.resolve-version.outputs.native_arch }}.dmg.sha256
          if-no-files-found: error
